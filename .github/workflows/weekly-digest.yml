name: Weekly NS-Digest

on:
  schedule:
    # Sunday at 20:00 UTC
    - cron: "0 20 * * 0"

  workflow_dispatch:

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger digest
        run: |
          curl --fail-with-body \
            -X POST \
            "${{ secrets.NETLIFY_DIGEST_URL }}"
